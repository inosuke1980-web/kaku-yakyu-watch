// Presentation-only timing: no changes to the already-resolved base/out call.
// Curve around the OUTSIDE of the diamond while arriving exactly on each bag.

  u*u*from[1]+2*u*clamped*control[1]+clamped*clamped*to[1]];

  batStart:left?[-3,2]:[3,2],batEnd:left?[10,-20]:[-10,-20],

function showBattingStance(player,force=false){

  bat.setAttribute('x1',plan.batStart[0]);bat.setAttribute('y1',plan.batStart[1]);

// A completed plate appearance stays in the original batting box through
