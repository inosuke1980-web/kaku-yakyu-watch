// Single clock shared by the throw and the advancing runner.

function renderRoster(side){if(!game)return;activeRoster=side;let t=game.teams[side];$('roster').innerHTML=`<div class="muted">${esc(t.name)}（${['新興・小規模','弱小','中堅','地方強豪','全国強豪'][t.level]}）</div><table><tr><th>番号・名前</th><th>学年</th><th>位置</th><th>打率</th><th>安打</th></tr>${t.players.map((p,i)=>`<tr class="player" data-i="${i}"><td>${p.number} ${esc(p.name)}</td><td>${p.grade}</td><td>${p.pos}</td><td>${p.ab?(p.h/p.ab).toFixed(3):'.---'}</td><td>${p.h}</td></tr>`).join('')}</table>`;document.querySelectorAll('.player').forEach(el=>el.addEventListener('click',()=>detail(t.players[+el.dataset.i])))}
function detail(p){$('detailTitle').textContent=p.name;$('detailBody').innerHTML=`<p>${p.grade}年 / ${p.pos} / ${p.throws}${p.bats} / ${p.height}cm ${p.weight}kg</p><p>背番号 ${p.number}｜出身：${esc(p.middle)}｜${p.club}</p><p>球歴：${esc(p.bio)}</p><p>${[['ミート',p.contact],['長打',p.power],['選球眼',p.eye],['走力',p.speed],['守備',p.field],['肩',p.arm],['制球',p.control],['球威',p.stuff],['スタミナ',p.stamina]].map(([n,v])=>`<span class="pill">${n} ${v}</span>`).join('')}</p><p>当日成績：${p.ab}打数 ${p.h}安打 ${p.hr}本塁打 ${p.rbi}打点 ${p.bb}四球</p><p>投球：${p.pitches}球 ${p.outsPitched}アウト ${p.kP}奪三振</p>`;$('detail').showModal()}
function finish(reason){if(game.ended)return;const endedTeam=current().bat;if(endedTeam.runs[game.inning-1]===null||endedTeam.runs[game.inning-1]===undefined)endedTeam.runs[game.inning-1]=0;game.ended=true;stop();$('pause').disabled=true;$('next').disabled=true;log(`${reason}！ ${game.teams[0].name} ${total(0)} - ${total(1)} ${game.teams[1].name}`);saveGame();historyRender()}
const KEY='kaku-yakyu-watch-v01-history';function getHistory(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return []}}
function saveGame(){try{let h=getHistory();h.unshift({id:Date.now(),date:new Date().toLocaleString('ja-JP'),t:game.t,teams:game.teams.map(t=>({...t,used:undefined})),events:game.events.slice(-80),pitches:game.totalPitches});localStorage.setItem(KEY,JSON.stringify(h.slice(0,30)))}catch(e){log('保存できませんでした（ブラウザの保存領域をご確認ください）。')}}
function historyRender(){let h=getHistory();$('history').replaceChildren();if(!h.length){$('history').textContent='保存済みの試合はありません。';return}h.forEach(g=>{let b=document.createElement('button');b.className='secondary';b.style.cssText='display:block;width:100%;text-align:left;margin-bottom:8px';b.textContent=`${g.date}｜${g.t.title}｜${g.teams[0].name} ${g.teams[0].runs.reduce((a,v)=>a+(v||0),0)} - ${g.teams[1].runs.reduce((a,v)=>a+(v||0),0)} ${g.teams[1].name}`;b.onclick=()=>showSaved(g);$('history').append(b)})}
function showSaved(g){$('detailTitle').textContent=`${g.teams[0].name} 対 ${g.teams[1].name}`;let body=`<p>${esc(g.t.title)}｜${g.date}｜${g.pitches}球</p>`;for(let t of g.teams){body+=`<h3>${esc(t.name)}　${t.runs.reduce((a,v)=>a+(v||0),0)}点 / ${t.hits}安打</h3><div class="tablewrap"><table><tr><th>選手</th><th>出身中学校</th><th>打数</th><th>安打</th><th>打点</th><th>投球数</th></tr>${t.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.middle)}</td><td>${p.ab}</td><td>${p.h}</td><td>${p.rbi}</td><td>${p.pitches}</td></tr>`).join('')}</table></div>`}$('detailBody').innerHTML=body;$('detail').showModal()}
function schedule(){clearTimeout(timer);if(!playing||!game||game.ended)return;/* The completed pitch call stays visible before the next windup. */timer=setTimeout(()=>{timer=null;pitch()},Math.max(450,1650/Number($('speed').value),animationHoldUntil-Date.now()+200))}
$('start').onclick=()=>{if(game&&!game.ended&&!confirm('進行中の試合を破棄して新しい試合を始めますか？'))return;try{init()}catch(e){console.error(e);$('status').textContent='開始エラー';$('event').textContent='開始できません: '+(e&&e.message?e.message:String(e));}};$('pause').onclick=()=>{if(!game||game.ended)return;playing=!playing;$('pause').textContent=playing?'一時停止':'再開';render();if(playing)schedule();else {clearTimeout(timer);clearTimeout(flightTimer);flightTimer=null;animationToken++;resetOutfieldPositions()}};$('next').onclick=()=>{if(!game||game.ended)return;stop();$('pause').textContent='再開';pitch()};$('speed').onchange=()=>{if(playing)schedule()};$('rosterAway').onclick=()=>renderRoster(0);$('rosterHome').onclick=()=>renderRoster(1);$('closeDetail').onclick=()=>$('detail').close();$('clear').onclick=()=>{if(confirm('保存済みの試合履歴をすべて削除しますか？')){localStorage.removeItem(KEY);historyRender()}};historyRender();
</script></body></html>
