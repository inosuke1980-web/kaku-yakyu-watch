name: Infield timing investigation
on:
  push:
    branches: [validation/out-change-investigation]
permissions:
  contents: read
jobs:
  investigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: |
          mkdir -p artifacts
          node tests/out-change-study.cjs | tee artifacts/timing.log
          FIXTURE_SCREENSHOT_DIR="$PWD/artifacts" node tests/mobile-watch-layout.cjs > artifacts/mobile.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infield-investigation
          path: artifacts/
          retention-days: 14
