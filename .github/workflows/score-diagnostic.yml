name: Scoreboard 12 inning comparison
on:
  push:
    branches: [validation/scoreboard-12-innings]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 0357eaf4925f474f33278eae7b626311954b4186
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install same browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare scoreboard
        run: node candidate/tests/score-diagnostic.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scoreboard-diagnostics
          path: diagnostics/
          retention-days: 14
